    <style>
      .t { font-family: Georgia, serif; }
      .m { font-family: 'IBM Plex Mono', Consolas, monospace; }
      .cn { fill: none; stroke: #6B6B6B; stroke-opacity: .38; stroke-width: .9; }
      .idx { fill: none; stroke: #6B6B6B; stroke-opacity: .6; stroke-width: 1.5; stroke-dasharray: 10 6; animation: curso 24s linear infinite; }
      .lt { fill: #5B7553; stroke: #1B2B48; stroke-width: 1; fill-opacity: .24; animation: lote 6s ease-in-out infinite; }
      .d1 { animation-delay: -1.2s; } .d2 { animation-delay: -2.4s; } .d3 { animation-delay: -3.6s; } .d4 { animation-delay: -4.8s; }
      .anel { fill: none; stroke: #D9482B; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: anel 3.2s ease-out infinite; }
      .agulha { transform-origin: 1210px 62px; animation: bussola 9s ease-in-out infinite alternate; }
      .cursor { animation: pisca 1.2s steps(1) infinite; }
      @keyframes curso { to { stroke-dashoffset: -64; } }
      @keyframes lote { 0%, 100% { fill-opacity: .14; } 50% { fill-opacity: .4; } }
      @keyframes anel { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
      @keyframes bussola { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
      @keyframes pisca { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .idx, .lt, .anel, .agulha, .cursor { animation: none; } .anel { opacity: .5; } }
    </style>
  </defs>
