  <title id="t">Plotline</title>
  <desc id="d">Planta de agrimensor: curvas de nível, quadras e lotes tracejados em vermelho, um marco de levantamento e a rosa dos ventos. Plotline gera a planta de loteamento em SVG a partir de GeoJSON.</desc>
